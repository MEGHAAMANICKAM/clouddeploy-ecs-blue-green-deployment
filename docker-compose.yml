services:
  backend:
    build: ./backend
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
    ports:
      - "8083:8080"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
    ports:
      - "3001:80"
